# Runs on every push to main and every pull request.
# Vercel Deployment Checks can wait for this job to pass before
# pointing the main link at a new deployment.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the code; it never needs to write to the repo.
permissions:
  contents: read

jobs:
  checks:
    name: Type check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
